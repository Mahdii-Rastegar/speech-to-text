[package]
name = "stt-app"
version = "0.1.0"
description = "Offline-first speech-to-text for Persian and English"
edition = "2021"
publish = false

[lib]
name = "stt_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# No debug info in development builds: it roughly halves the size of the build folder.
[profile.dev]
debug = false

[profile.release]
strip = true
lto = "thin"
codegen-units = 4
