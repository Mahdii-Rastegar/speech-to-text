[package]
name = "stt-app"
version = "0.1.0"
description = "Offline-first speech-to-text for Persian and English"
edition = "2021"
publish = false

[lib]
name = "stt_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# SQLite is compiled in, so the app needs no database installed on the computer.
rusqlite = { version = "0.40", features = ["bundled"] }
# Reads the audio files the web view cannot decode itself (Apple Lossless above all).
symphonia = { version = "0.5", features = ["aac", "alac", "isomp4", "mp3"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

# No debug info in development builds: it roughly halves the size of the build folder.
[profile.dev]
debug = false

[profile.release]
strip = true
lto = "thin"
codegen-units = 4
